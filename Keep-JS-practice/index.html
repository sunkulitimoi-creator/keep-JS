<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <section>
            <div class="left">
                <span class="material-symbols-outlined">
                    menu
                </span>
                <img src="https://www.gstatic.com/images/branding/productlogos/keep_2026/v2/web-48dp/logo_keep_2026_color_1x_web_48dp.png" alt="Logo">
                <p>Keep</p>
            </div>
            
            <div class="right">
                <div class="search-area">
                    <span class="material-symbols-outlined">
                        search
                    </span>
                    <input type="search" placeholder="Search">
                </div>
                <div class="right-icons">
                    <span class="material-symbols-outlined">
                        refresh
                    </span>
                    <span class="material-symbols-outlined">
                        view_agenda
                    </span>
                    <span class="material-symbols-outlined">
                        settings
                    </span>
                    <span class="material-symbols-outlined">
                        apps
                    </span>
                    <span class="material-symbols-outlined">
                        person
                    </span>
                </div>
            </div>
        </section>
        
    </header>
    
    <section id="main-container">
        <aside>
            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    lightbulb_2
                </span>
                Notes
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    notifications
                </span>
                Reminders
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    label
                </span>
                Inspiration
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    label
                </span>
                Other
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    label
                </span>
                Personal
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    label
                </span>
                Work
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    edit
                </span>
                Edit Labels
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    archive
                </span>
                Archive
            </span>

            <span class="side-bar-item">
                <span class="material-symbols-outlined">
                    delete
                </span>
                Trash
            </span>
        </aside>
        <main>
            <div class="writing-area">
                <div class="title-section">
                    <input type="text" id="title" placeholder="Title">
                    <span class="material-symbols-outlined">
                        keep
                    </span>
                </div>
                <textarea id="note" placeholder="Take a note..."></textarea>
            </div>
            <div class="note-formatting">
                <span class="material-symbols-outlined">
                    text_format
                </span>
                <span class="material-symbols-outlined">
                    palette
                </span>
                <span class="material-symbols-outlined">
                    add_alert
                </span>
                <span class="material-symbols-outlined">
                    person_add
                </span>

                <span class="material-symbols-outlined">
                    image
                </span>

                <span class="material-symbols-outlined">
                    archive
                </span>

                <span class="material-symbols-outlined">
                    more_vert
                </span>

                <span class="material-symbols-outlined">
                    undo
                </span>

                <span class="material-symbols-outlined">
                    redo
                </span>             

                <button id="close-btn" onclick="saveNote()">Close</button>

            </div>

            <section id="notes" >

            </section>

            <div class="overlay" id="overlay"></div>
        </main>

       
    </section>
  

    <script src="script.js" type="text/javascript"></script>
</body>
</html>
